pipelines:
  - name: job_processing
    pipeline_class: job_processing
    schedule: "0 20 * * *"            # daily at 8 PM UTC
    enabled: true
    retry:
      max_attempts: 3
      backoff_base: 2.0
      backoff_max: 60.0
    params:
      batch_size: 5000

  - name: job_feature_engineering
    pipeline_class: job_feature_engineering
    schedule: "30 9 * * *"           # daily at 9:30 AM UTC
    enabled: true
    retry:
      max_attempts: 3
      backoff_base: 2.0
      backoff_max: 60.0
    params:
      batch_size: 5000

  # -- Example pipelines (disabled) ------------------------------------------
